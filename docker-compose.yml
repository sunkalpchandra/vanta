services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vanta
      POSTGRES_PASSWORD: vanta
      POSTGRES_DB: vanta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h forces TCP: during first-boot initdb, postgres runs a socket-only
      # temp server that a bare pg_isready would report as healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vanta -d vanta"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://vanta:vanta@db:5432/vanta
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: http://localhost:3000
      # ANTHROPIC_API_KEY: set to enable LLM narratives
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # What the *browser* uses (AskForm, share-card links) — host-published port.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      # What SSR inside this container uses — localhost:8000 here would point
      # at the web container itself and render every page empty.
      API_URL_INTERNAL: http://api:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
