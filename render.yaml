# Render blueprint — deploys the vanta play-money backend as a real, live
# server so trading works for anyone, no local setup.
#
# One-click: push this repo to GitHub, then in Render → "New +" → "Blueprint",
# point it at the repo. Render provisions the Postgres database, the FastAPI
# web service, and a 30-minute market-sync cron. Copy the API service URL into
# the frontend's NEXT_PUBLIC_API_URL (Vercel) and set FRONTEND_ORIGIN here to
# the frontend URL. See docs/DEPLOY-LIVE.md.
#
# Play money only — ⓥ credits are virtual. Nothing here touches real money.

databases:
  - name: vanta-db
    plan: free
    databaseName: vanta
    user: vanta

services:
  # The API. On first boot it seeds demo markets, so trading works immediately;
  # the sync cron then fills in real Polymarket/Kalshi/Manifold markets.
  - type: web
    name: vanta-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vanta-db
          property: connectionString
      # Set this to your deployed frontend origin (e.g. https://vanta.vercel.app).
      # *.vercel.app preview URLs are always allowed via the API's origin regex.
      - key: FRONTEND_ORIGIN
        sync: false
      # Trading identity is the per-user API key; operator gating stays off so
      # anyone can register and trade play money.
      - key: REQUIRE_API_KEY
        value: "false"
      # In-process market sync every 30 min: adds new markets, refreshes
      # prices, records price-history ticks, and settles resolved markets — all
      # on this one free web service (Render's Cron Jobs are a paid feature, so
      # the app runs its own loop instead). Set to 0 to disable.
      - key: SYNC_INTERVAL_MINUTES
        value: "30"
      - key: PYTHONUNBUFFERED
        value: "1"
