[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
  "B008", # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
# Demo corpus: long literal evidence strings are data, not code.
"app/data.py" = ["E501"]
# Inline SVG template: markup lines don't wrap meaningfully.
"app/routers/cards.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
